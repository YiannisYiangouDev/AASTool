<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <!-- Primary brand gradient: teal to blue -->
    <linearGradient id="brand-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Subtle glow -->
    <radialGradient id="glow" cx="256" cy="200" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg-grad)"/>

  <!-- Glow effect -->
  <circle cx="256" cy="200" r="200" fill="url(#glow)"/>

  <!-- Branded icon shape: rounded square -->
  <rect x="176" y="88" width="160" height="160" rx="40" fill="url(#brand-grad)" opacity="0.95"/>

  <!-- "AAS" letters inside the icon -->
  <text x="256" y="182" text-anchor="middle" fill="white" font-size="72" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-3">AAS</text>

  <!-- Tool icon: small gear/wrench hint at top-right of the brand block -->
  <circle cx="312" cy="112" r="16" fill="white" opacity="0.25"/>
  <circle cx="312" cy="112" r="6" fill="#0f172a" opacity="0.5"/>

  <!-- AASTool wordmark -->
  <text x="256" y="320" text-anchor="middle" fill="white" font-size="56" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-1">AASTool</text>

  <!-- Tagline -->
  <text x="256" y="365" text-anchor="middle" fill="#64748b" font-size="22" font-weight="500" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2">AAS</text>

  <!-- Divider -->
  <line x1="160" y1="395" x2="352" y2="395" stroke="#334155" stroke-width="1.5"/>

  <!-- Credits -->
  <text x="256" y="430" text-anchor="middle" fill="#475569" font-size="16" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Developed by Y</text>

  <!-- Corner accent dots -->
  <circle cx="64" cy="64" r="4" fill="#2dd4bf" opacity="0.4"/>
  <circle cx="448" cy="64" r="4" fill="#3b82f6" opacity="0.4"/>
  <circle cx="64" cy="448" r="4" fill="#2dd4bf" opacity="0.4"/>
  <circle cx="448" cy="448" r="4" fill="#3b82f6" opacity="0.4"/>
</svg>
